stages:
  - lint
  - test
  - package
  - docker
  - deploy

image: python:3.11

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONUNBUFFERED: "1"
  HF_CHECKPOINT_FILENAME: "screw_patchcore.pt"

cache:
  paths:
    - .cache/pip

before_script:
  - python -V
  - pip install --upgrade pip
  - pip install -r requirements.txt
  - pip install pytest ruff huggingface_hub

# LINT 

lint:
  stage: lint
  script:
    - ruff check src deployment tests

# TEST

test:
  stage: test
  script:
    - pytest tests

# PACKAGE

package:
  stage: package
  script:
    - mkdir -p dist/model
    - cp models/checkpoints/${HF_CHECKPOINT_FILENAME} dist/model/
    - cp config/config.yaml dist/model/config.yaml
  artifacts:
    expire_in: 1 week
    paths:
      - dist/model

# DOCKER BUILD TEST

docker_build:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build --no-cache
        -f deployment/hf_space/Dockerfile
        -t robot-vision-demo
        .                              # ← project root as build context
    - docker run --rm robot-vision-demo find /app -type f | sort
  only:
    - main

# DEPLOY

deploy_model:
  stage: deploy
  script:
    - python deployment/upload_model.py
  only:
    - main

deploy_space:
  stage: deploy
  script:
    - python deployment/upload_space.py
  only:
    - main